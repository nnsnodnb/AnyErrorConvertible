name: Test

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    strategy:
      matrix:
        include:
          - runner: macos-26
            xcode: '26.3' # Swift 6.2
          - runner: macos-26
            xcode: '26.6' # Swift 6.3
          - runner: xcode-27
            xcode: '27.1' # Swift 6.4

    runs-on: ${{ matrix.runner }}

    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    name: Run tests ${{ matrix.runner }} (Xcode ${{ matrix.xcode }})

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Run tests
      run: swift test
